# ===========================================================
# Prometheus — Configuração de Scraping
# ===========================================================
# Para adicionar exporters, descomente as seções relevantes
# e adicione os containers no docker-compose.prod.yml
# ===========================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# --- Alerting (Futuro) ---
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# --- Rules (Futuro) ---
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Prometheus Self-Monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- Backend API (FastAPI com prometheus-fastapi-instrumentator) ---
  - job_name: 'rjchronos-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend-api'
          environment: 'production'

  # --- Redis Exporter (descomente se adicionar redis-exporter ao compose) ---
