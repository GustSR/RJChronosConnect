# ===========================================================
# Nginx — Reverse Proxy para RJChronosConnect
# Otimizado para ESCALA ENTERPRISE (milhões de CPEs)
# ===========================================================

# --- Tuning de Workers ---
# auto = 1 worker por CPU core. Para 8 cores = 8 workers.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;    # Firmware uploads podem ser grandes
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    # --- Mime Types ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --- Rate Limiting ---
    # Limita a 100 requests/segundo por IP para API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # Limita a 30 requests/segundo por IP para auth
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/s;

    # --- Upstreams ---
    upstream backend_api {
        least_conn;
        server backend:8000;
        # Para escalar: adicione mais backends
        # server backend-2:8000;
        # server backend-3:8000;
        keepalive 32;
    }

    upstream genieacs_ui {
        server genieacs:3000;
        keepalive 8;
    }

    upstream genieacs_nbi {
        server genieacs:7557;
        keepalive 16;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 8;
    }

    # --- Security Headers Map ---
    map $sent_http_content_type $referrer_policy {
        ~image/ "no-referrer";
        default "strict-origin-when-cross-origin";
    }

    # ===========================================================
    # SERVER — HTTP → Redirect HTTPS (produção)
    # ===========================================================
    # Descomente em produção com SSL:
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ===========================================================
    # SERVER PRINCIPAL
    # ===========================================================
    server {
        listen 80;
        server_name _;

        # --- Em produção, use HTTPS ---
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 1d;
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # --- Security Headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy $referrer_policy always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:;" always;

        # ===========================================================
        # BACKEND API — /api/
        # ===========================================================
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts para operações longas (firmware, bulk operations)
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 16k;
        }

        # ===========================================================
        # AUTH ENDPOINTS — Rate limiting mais restrito
        # ===========================================================
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend_api/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ===========================================================
        # WEBSOCKET — /ws/ (alertas em tempo real)
        # ===========================================================
        location /ws/ {
            proxy_pass http://backend_api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ===========================================================
        # GENIEACS UI — /genieacs/ (acesso administrativo)
        # ===========================================================
        location /genieacs/ {
            # Em produção: restringir acesso por IP
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;

            proxy_pass http://genieacs_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===========================================================
        # GENIEACS NBI — /genieacs-api/ (API interna)
        # ===========================================================
        location /genieacs-api/ {
            # NUNCA expor publicamente — apenas backend acessa
            # allow 172.16.0.0/12;
            # deny all;

            proxy_pass http://genieacs_nbi/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ===========================================================
        # HEALTH CHECK
        # ===========================================================
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ===========================================================
        # FRONTEND — / (SPA React)
        # ===========================================================
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Static Assets Cache ---
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_app;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}