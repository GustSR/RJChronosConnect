version: '3.8'

# ===========================================================
# RJChronosConnect — Docker Compose PRODUÇÃO (Enterprise)
# Otimizado para alta escala
# ===========================================================
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ===========================================================

services:

  # --- Nginx: SSL, rate limiting, static cache ---
  reverse-proxy:
    container_name: rjchronos_proxy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Descomente para SSL:
      # - ./infrastructure/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  # --- Frontend: Build otimizado ---
  frontend:
    container_name: rjchronos_frontend_prod
    build:
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # --- Backend: Gunicorn com múltiplos workers ---
  backend:
    container_name: rjchronos_backend_prod
    build:
      dockerfile: Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=warning
      - CORS_ORIGINS=https://${DOMAIN:-chronos.rjsolucoes.com}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Escala: 2 * CPU_CORES + 1
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-8}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=120
      - GUNICORN_MAX_REQUESTS=50000
      - GUNICORN_MAX_REQUESTS_JITTER=5000
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 1G

  # --- Celery Worker: Tarefas assíncronas ---
  celery-worker:
    container_name: rjchronos_celery_worker
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=8
      --max-tasks-per-child=1000
      -Q critical,normal,low
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/${POSTGRES_DB}
      - GENIEACS_NBI_URL=http://genieacs:7557
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://rjchronos:${RABBITMQ_PASSWORD:-rjchronos2026}@rabbitmq:5672/
    networks:
      - rjchronos-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G

  # --- Celery Beat: Agendamento de tarefas ---
  celery-beat:
    container_name: rjchronos_celery_beat
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://rjchronos:${RABBITMQ_PASSWORD:-rjchronos2026}@rabbitmq:5672/
    networks:
      - rjchronos-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # --- Metrics Collector: Coleta periódica de métricas ---
  metrics-collector:
    container_name: rjchronos_metrics_collector
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    command: python -m app.services.metrics_collector
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/${POSTGRES_DB}
      - GENIEACS_NBI_URL=http://genieacs:7557
      - REDIS_URL=redis://redis:6379/0
      - COLLECTION_INTERVAL=300
    networks:
      - rjchronos-net
    depends_on:
      db-app:
        condition: service_healthy
      genieacs:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # --- GenieACS: Escala para alta carga ---
  genieacs:
    container_name: rjchronos_genieacs_prod
    restart: always
    environment:
      - GENIEACS_CWMP_WORKER_PROCESSES=8
      - GENIEACS_NBI_WORKER_PROCESSES=4
      - GENIEACS_FS_WORKER_PROCESSES=2
      - GENIEACS_CWMP_CONNECTION_REQUEST_TIMEOUT=60000
      - GENIEACS_TASKS_TIMEOUT=900000
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 4G
        reservations:
          cpus: '4'
          memory: 2G

  # --- PostgreSQL: Tuning para produção ---
  db-app:
    container_name: rjchronos_db_app_prod
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
    volumes:
      - postgres_app_data_prod:/var/lib/postgresql/data
    restart: always
    shm_size: '512m'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # --- MongoDB: Tuning para GenieACS ---
  db-acs:
    container_name: rjchronos_db_acs_prod
    command: >
      mongod
      --wiredTigerCacheSizeGB 2
      --storageEngine wiredTiger
      --directoryperdb
      --bind_ip_all
      --setParameter diagnosticDataCollectionEnabled=false
    volumes:
      - mongo_acs_data_prod:/data/db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # --- Redis: Cache + Filas ---
  redis:
    container_name: rjchronos_redis_prod
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 300 100
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # --- RabbitMQ: Produção ---
  rabbitmq:
    container_name: rjchronos_rabbitmq_prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # --- Prometheus: Métricas ---
  prometheus:
    image: prom/prometheus:latest
    container_name: rjchronos_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - rjchronos-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # --- Grafana: Dashboards ---
  grafana:
    image: grafana/grafana:latest
    container_name: rjchronos_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-chronos.rjsolucoes.com}/grafana/
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - rjchronos-net
    depends_on:
      - prometheus
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  postgres_app_data_prod:
    name: rjchronos_postgres_prod
  mongo_acs_data_prod:
    name: rjchronos_mongo_prod
  nginx_logs:
    name: rjchronos_nginx_logs
  prometheus_data:
    name: rjchronos_prometheus_data
  grafana_data:
    name: rjchronos_grafana_data
