version: "3.8"

# Este arquivo sobrescreve o docker-compose.yml principal para o ambiente de desenvolvimento.

services:
    edge:
        container_name: rjchronos_edge_dev
        build:
            context: .
            dockerfile: services/edge/Dockerfile.dev
        ports:
            - "8081:8081"
        # volumes:
        #     - ./services/edge:/app
        #     - /app/node_modules
        environment:
            - EDGE_HOST=0.0.0.0
            - EDGE_PORT=8081
            - BACKEND_INTERNAL_URL=http://backend:8000
            - GENIEACS_UI_INTERNAL_URL=http://genieacs:3000
            - FRONTEND_DEV_URL=http://frontend:3001
            - BETTER_AUTH_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/${POSTGRES_DB}
            - BETTER_AUTH_BASE_PATH=/api/auth
            - BETTER_AUTH_BASE_URL=${BETTER_AUTH_BASE_URL}
            - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS}
            - EDGE_LEGACY_AUTH_PROXY_ENABLED=${EDGE_LEGACY_AUTH_PROXY_ENABLED}
            - EDGE_LEGACY_AUTH_PROXY_HEADER=${EDGE_LEGACY_AUTH_PROXY_HEADER}
            - EDGE_LEGACY_AUTH_PROXY_TOKEN=${EDGE_LEGACY_AUTH_PROXY_TOKEN}
        depends_on:
            - backend
            - db-app
        networks:
            - rjchronos-net

    frontend:
        container_name: rjchronos_frontend_dev
        ports:
            - "8088:3001"
        build:
            context: ./services/frontend
            dockerfile: Dockerfile.dev
        command: bun run dev -- --port 3001
        # volumes:
        #     - ./services/frontend:/app
        #     - /app/node_modules # Impede que o node_modules local sobrescreva o do contêiner
        networks:
            - rjchronos-net
        depends_on:
            - backend
        environment:
            - VITE_BACKEND_PROXY_TARGET=http://backend:8000
            - VITE_OLT_MANAGER_PROXY_TARGET=http://olt-manager-huawei:8001
        healthcheck:
            test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001').then(r => {if(!r.ok) process.exit(1)}).catch(() => process.exit(1))\""]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    backend:
        container_name: rjchronos_backend_dev
        build:
            context: .
            dockerfile: services/backend-api/Dockerfile.dev
        # volumes:
        #     - ./services/backend-api:/app
        #     - ./shared:/app/shared
        ports:
            - "8090:8000"
        command: ./start.sh
        depends_on:
            db-app:
                condition: service_started
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-app:5432/${POSTGRES_DB}
            - GENIACS_API_URL=http://genieacs:7557/
            - OLT_MANAGER_URL=http://olt-manager-huawei:8001
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
            - RABBITMQ_HOST=rabbitmq
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_HOST=redis
            - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
            - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}

    # --- Novos Serviços ---
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: rjchronos_rabbitmq_dev
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - rjchronos-net
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
        volumes:
            - rabbitmq_data_dev:/var/lib/rabbitmq # Persistência de dados em dev
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
            interval: 5s
            timeout: 5s
            retries: 10

    works:
        build:
            context: ./services/works
            dockerfile: Dockerfile.dev
        container_name: rjchronos_works_dev
        networks:
            - rjchronos-net
        depends_on:
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
            backend:
                condition: service_started
            olt-manager-huawei:
                condition: service_started
        command: celery -A celery_app worker --loglevel=info --concurrency=4
        environment:
            - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
            - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
            - REDIS_HOST=redis
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - OLT_MANAGER_HUAWEI_URL=http://olt-manager-huawei:8001
            - BACKEND_API_URL=http://backend:8000

    celery-beat:
        build:
            context: ./services/works
            dockerfile: Dockerfile.dev
        container_name: rjchronos_celery_beat_dev
        networks:
            - rjchronos-net
        depends_on:
            - rabbitmq
            - redis
        command: celery -A celery_app beat --loglevel=info
        environment:
            - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
            - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
            - RABBITMQ_HOST=rabbitmq
            - REDIS_HOST=redis
            - REDIS_PASSWORD=${REDIS_PASSWORD}

    olt-manager-huawei:
        build:
            context: ./services/olts-managers/olt-manager-huawei
            dockerfile: Dockerfile.dev
        container_name: rjchronos_olt_manager_huawei_dev
        # volumes:
        #     - ./services/olts-managers/olt-manager-huawei/src:/app/src
        ports:
            - "8001:8001"
        networks:
            - rjchronos-net
        depends_on:
            rabbitmq:
                condition: service_healthy
        command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
        environment:
            # Configurações de conexão com outros serviços
            - RABBITMQ_HOST=rabbitmq
            - RABBITMQ_PORT=5672
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
            - BACKEND_API_URL=http://backend:8000

            # Configurações de OLT para testes
            - TEST_OLT_IP=${TEST_OLT_IP:-}
            - TEST_OLT_MODEL=${TEST_OLT_MODEL:-MA5600T}
            - OLT_IP_MODEL_MAPPING=${OLT_IP_MODEL_MAPPING:-{}}

            # Configurações SNMP
            - TRAP_LISTENER_HOST=0.0.0.0
            - TRAP_LISTENER_PORT=162
            - SNMP_COMMUNITY=${SNMP_COMMUNITY:-1wAdehYft0c[}

    # olt-manager-fiberhome:
    #     build:
    #         context: ./services/olts-managers/olt-manager-fiberhome
    #         dockerfile: Dockerfile.dev
    #     container_name: rjchronos_olt_manager_fiberhome_dev
    #     volumes:
    #         - ./services/olts-managers/olt-manager-fiberhome/src:/app/src
    #     ports:
    #         - "8002:8002"
    #     networks:
    #         - rjchronos-net
    #     depends_on:
    #         - rabbitmq
    #     command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload
    #     environment:
    #         - BACKEND_API_URL=http://backend:8000
    #         - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}

    # genieacs-sim:
    #     image: drumsergio/genieacs-sim:latest
    #     container_name: "rjchronos_genieacs-sim_dev"
    #     networks:
    #         - rjchronos-net
    #     depends_on:
    #         - genieacs

    # genieacs-mcp:
    #     image: drumsergio/genieacs-mcp:latest
    #     container_name: "rjchronos_genieacs-mcp_dev"
    #     environment:
    #         - ACS_URL=http://10.250.10.1:7557
    #         - ACS_USER=admin
    #         - ACS_PASS=admin
    #     ports:
    #         - "8082:8080"
    #     networks:
    #         - rjchronos-net
    #     depends_on:
    #         - genieacs

    # --- Nomes e Volumes Específicos para DEV ---
    genieacs:
        container_name: rjchronos_genieacs_dev
        build:
            context: ./services/genieacs
        ports:
            - "3000:3000"
            - "7557:7557"
        networks:
            rjchronos-net:
            onu_management_net:
                ipv4_address: 10.200.7.253
        depends_on:
            - db-acs
            - redis
        environment:
            - GENIEACS_MONGODB_CONNECTION_URL=mongodb://db-acs:27017/genieacs
            - GENIEACS_REDIS_HOST=redis
            - GENIEACS_UI_JWT_SECRET=${UI_JWT_SECRET}
            - GENIEACS_DEBUG_FILE=/var/log/genieacs/genieacs-debug.yaml
            - GENIEACS_DEBUG_FORMAT=yaml
            # Configurações Dual-Homed
            - GENIEACS_CWMP_INTERFACE=10.200.7.253
            - GENIEACS_CWMP_PORT=7547
            - GENIEACS_FS_INTERFACE=10.200.7.253
            - GENIEACS_FS_PORT=7567
            - GENIEACS_NBI_INTERFACE=0.0.0.0
            - GENIEACS_NBI_PORT=7557
            - GENIEACS_UI_INTERFACE=0.0.0.0
            - GENIEACS_UI_PORT=3000

    db-app:
        container_name: rjchronos_db_app_dev
        image: postgres:15-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_app_data_dev:/var/lib/postgresql/data

    db-acs:
        container_name: rjchronos_db_acs_dev
        image: mongo:4.4
        volumes:
            - mongo_acs_data_dev:/data/db

    redis:
        container_name: rjchronos_redis_dev
        image: redis:alpine
        ports:
            - "6379:6379"
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data_dev:/data # Persistência de dados em dev
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_app_data_dev:
    mongo_acs_data_dev:
    rabbitmq_data_dev:
    redis_data_dev:

networks:
    rjchronos-net:
        driver: bridge
    onu_management_net:
        driver: macvlan
        driver_opts:
            parent: ens19
        ipam:
            config:
                - subnet: 10.200.0.0/21
                  gateway: 10.200.0.1
                  ip_range: 10.200.7.240/28
