# ===========================================================
# Nginx — Configuração do Frontend SPA (dentro do container)
# ===========================================================
# Esta config é usada DENTRO do container do frontend.
# O reverse-proxy principal é outro arquivo.
# ===========================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- SPA Routing ---
    # Qualquer rota que não encontre arquivo estático
    # redireciona para index.html (React Router cuida do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Static Assets com Cache Longo ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Health Check ---
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend"}';
        add_header Content-Type application/json;
    }

    # --- Segurança: Não servir dotfiles ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
